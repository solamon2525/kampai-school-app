<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ตารางสอน / ตารางเรียน — โรงเรียนบ้านคำไผ่</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c10;--bg2:#0d1118;--surface:#111822;--surface2:#162030;--surface3:#1a2838;
  --border:#1e2f42;--border2:#243848;
  --text:#e8f0f8;--muted:#4d7090;--hint:#2a4560;
  --blue:#2563eb;--blue2:#3b82f6;--blue3:#93c5fd;
  --teal:#0d9488;--teal2:#14b8a6;--teal3:#5eead4;
  --amber:#d97706;--amber2:#f59e0b;--amber3:#fcd34d;
  --r:10px
}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.bg-fx{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-fx::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(37,99,235,.08) 0%,transparent 65%);top:-200px;right:-100px;animation:a1 18s ease-in-out infinite}
.bg-fx::after{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(13,148,136,.06) 0%,transparent 65%);bottom:-100px;left:-100px;animation:a2 22s ease-in-out infinite}
@keyframes a1{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,30px)}}
@keyframes a2{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-20px)}}
.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 16px 80px}
.nav{display:flex;align-items:center;gap:12px;padding:16px 0 20px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap}
.back-btn{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600;padding:7px 14px;border:1px solid var(--border);border-radius:8px;transition:.2s;white-space:nowrap}
.back-btn:hover{color:var(--blue3);border-color:var(--blue2)}
.nav-title{font-size:17px;font-weight:900;color:var(--text);flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;border:none;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;white-space:nowrap}
.btn-blue{background:var(--blue2);color:#fff;box-shadow:0 3px 14px rgba(59,130,246,.3)}
.btn-blue:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(59,130,246,.4)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--blue2);color:var(--blue3)}
.btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:7px}
/* MODE TABS */
.mode-tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px;margin-bottom:20px;width:fit-content}
.mtab{padding:8px 18px;border-radius:7px;border:none;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);background:transparent;transition:.2s}
.mtab.active{background:rgba(59,130,246,.12);color:var(--blue3);border:1px solid rgba(59,130,246,.2)}
/* FILTER ROW */
.filter-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.sel{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-family:'Sarabun',sans-serif;font-size:13px;outline:none;cursor:pointer;transition:.2s;min-width:130px}
.sel:focus{border-color:var(--blue2)}
.sel option{background:#0d1118}
/* TIMETABLE */
.timetable-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
.timetable{width:100%;border-collapse:collapse;min-width:700px}
.timetable th{background:var(--surface2);padding:10px 8px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;border-right:1px solid var(--border);border-bottom:1px solid var(--border2);letter-spacing:.4px;white-space:nowrap}
.timetable th.day-col{text-align:left;padding-left:14px;min-width:80px}
.timetable td{border-right:1px solid rgba(30,47,66,.6);border-bottom:1px solid rgba(30,47,66,.6);padding:0;vertical-align:top;min-width:100px}
.timetable tr:last-child td{border-bottom:none}
.timetable td.day-label{padding:10px 14px;font-size:13px;font-weight:700;background:var(--surface2);border-right:1px solid var(--border);white-space:nowrap;color:var(--text)}
.timetable td.day-label .day-th{font-size:11px;color:var(--muted);margin-top:2px}
.cell{min-height:56px;padding:6px;cursor:pointer;transition:background .15s;position:relative}
.cell:hover{background:rgba(59,130,246,.06)}
.cell.has-subject{background:rgba(59,130,246,.04)}
.subject-block{border-radius:7px;padding:6px 8px;font-size:12px;font-weight:700;line-height:1.3;position:relative}
.subject-block .sub-name{font-weight:800;font-size:12px}
.subject-block .sub-teacher{font-size:10px;margin-top:2px;opacity:.8}
.cell-empty{width:100%;height:100%;min-height:48px;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:18px;opacity:0;transition:opacity .2s}
.cell:hover .cell-empty{opacity:1}
.del-btn{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.4);border:none;color:#fff;border-radius:4px;width:16px;height:16px;font-size:10px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1}
.subject-block:hover .del-btn{display:flex}
/* SUBJECT COLORS */
.sc-thai   {background:rgba(245,158,11,.15);border-left:3px solid var(--amber2);color:var(--amber3)}
.sc-math   {background:rgba(16,185,129,.12);border-left:3px solid var(--teal2);color:var(--teal3)}
.sc-sci    {background:rgba(139,92,246,.12);border-left:3px solid #8b5cf6;color:#c4b5fd}
.sc-social {background:rgba(249,115,22,.1); border-left:3px solid #f97316;color:#fdba74}
.sc-eng    {background:rgba(239,68,68,.1);  border-left:3px solid #ef4444;color:#fca5a5}
.sc-pe     {background:rgba(59,130,246,.12);border-left:3px solid var(--blue2);color:var(--blue3)}
.sc-art    {background:rgba(236,72,153,.1); border-left:3px solid #ec4899;color:#f9a8d4}
.sc-tech   {background:rgba(20,184,166,.1); border-left:3px solid var(--teal2);color:var(--teal3)}
.sc-home   {background:rgba(132,204,22,.1); border-left:3px solid #84cc16;color:#bef264}
.sc-act    {background:rgba(99,102,241,.1); border-left:3px solid #6366f1;color:#a5b4fc}
.sc-other  {background:rgba(100,116,139,.1);border-left:3px solid #64748b;color:#94a3b8}
/* PANEL */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.ph-title{font-size:13px;font-weight:800;flex:1}
/* SUBJECT LEGEND */
.legend-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend-dot{width:10px;height:10px;border-radius:3px}
/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:.25s}
.modal-ov.open{opacity:1;pointer-events:all}
.modal{background:#0c1520;border:1px solid var(--border2);border-radius:16px;width:100%;max-width:420px;padding:24px 20px;position:relative;transform:translateY(20px) scale(.97);transition:.25s;max-height:90vh;overflow-y:auto}
.modal-ov.open .modal{transform:none}
.modal h3{font-size:15px;font-weight:900;margin-bottom:16px}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-close:hover{color:var(--text)}
.form-g{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-g label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.form-g input,.form-g select{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--text);font-family:'Sarabun',sans-serif;font-size:13px;outline:none;transition:.2s;width:100%}
.form-g input:focus,.form-g select:focus{border-color:var(--blue2)}
.form-g select option{background:#0c1520}
.modal-footer{display:flex;gap:8px;margin-top:14px}
.modal-footer .btn{flex:1}
/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(8,14,22,.96);border:1px solid var(--border2);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;transition:transform .3s;backdrop-filter:blur(10px);white-space:nowrap}
.toast.show{transform:translateX(-50%)}
.toast.ok{border-color:rgba(16,185,129,.4);color:var(--teal3)}
.toast.err{border-color:rgba(239,68,68,.4);color:#fca5a5}
.spinner{display:inline-block;width:28px;height:28px;border:2.5px solid rgba(255,255,255,.08);border-top-color:var(--blue2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.nav-title{font-size:15px}.btn{padding:7px 12px;font-size:12px}}
</style>
</head>
<body>
<div class="bg-fx"></div>

<div id="auth-bar"></div>
<div class="page">

  <div class="nav">
    <a href="index.html" class="back-btn">← หน้าหลัก</a>
    <div class="nav-title">🗓️ ตารางสอน / ตารางเรียน</div>
    <button class="btn btn-blue" data-auth="write" onclick="openAddModal()">+ เพิ่มคาบเรียน</button>
    <button class="btn btn-outline" data-auth="write" onclick="saveSchedule()">💾 บันทึก</button>
  </div>

  <!-- MODE TABS -->
  <div class="mode-tabs">
    <button class="mtab active" id="mt-class" onclick="setMode('class')">🏫 ตารางตามชั้นเรียน</button>
    <button class="mtab" id="mt-teacher" onclick="setMode('teacher')">👨‍🏫 ตารางตามครู</button>
  </div>

  <!-- FILTER -->
  <div class="filter-row">
    <select class="sel" id="sel-target" onchange="renderTable()">
      <option value="">— เลือก —</option>
    </select>
    <select class="sel" id="sel-term">
      <option value="1">ภาคเรียนที่ 1</option>
      <option value="2">ภาคเรียนที่ 2</option>
    </select>
    <select class="sel" id="sel-year">
      <option value="2568">2568</option>
      <option value="2567">2567</option>
    </select>
    <div style="flex:1"></div>
    <button class="btn btn-outline btn-sm" onclick="printSchedule()">🖨 พิมพ์</button>
  </div>

  <!-- LEGEND -->
  <div class="legend-wrap" id="legend-wrap"></div>

  <!-- TIMETABLE -->
  <div class="timetable-wrap" id="timetable-wrap">
    <div style="text-align:center;padding:48px;color:var(--hint)">เลือกห้องเรียนหรือครูด้านบนเพื่อดูตาราง</div>
  </div>

</div>

<!-- ADD MODAL -->
<div class="modal-ov" id="add-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('add-modal')">✕</button>
    <h3>+ เพิ่มคาบเรียน</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-g">
        <label>วัน *</label>
        <select id="a-day">
          <option value="0">จันทร์</option>
          <option value="1">อังคาร</option>
          <option value="2">พุธ</option>
          <option value="3">พฤหัสบดี</option>
          <option value="4">ศุกร์</option>
        </select>
      </div>
      <div class="form-g">
        <label>คาบที่ *</label>
        <select id="a-period">
          <option value="0">คาบ 1 (08:30)</option>
          <option value="1">คาบ 2 (09:30)</option>
          <option value="2">คาบ 3 (10:30)</option>
          <option value="3">คาบ 4 (11:30)</option>
          <option value="4">คาบ 5 (13:00)</option>
          <option value="5">คาบ 6 (14:00)</option>
          <option value="6">คาบ 7 (15:00)</option>
        </select>
      </div>
    </div>
    <div class="form-g">
      <label>วิชา *</label>
      <select id="a-subject">
        <option value="">— เลือก —</option>
        <option value="thai|sc-thai">ภาษาไทย</option>
        <option value="math|sc-math">คณิตศาสตร์</option>
        <option value="sci|sc-sci">วิทยาศาสตร์</option>
        <option value="social|sc-social">สังคมศึกษา</option>
        <option value="eng|sc-eng">ภาษาอังกฤษ</option>
        <option value="pe|sc-pe">สุขศึกษา/พลศึกษา</option>
        <option value="art|sc-art">ศิลปะ</option>
        <option value="tech|sc-tech">เทคโนโลยี</option>
        <option value="home|sc-home">การงานอาชีพ</option>
        <option value="act|sc-act">กิจกรรมพัฒนาผู้เรียน</option>
        <option value="other|sc-other">อื่นๆ</option>
      </select>
    </div>
    <div class="form-g">
      <label>ชั้นเรียน *</label>
      <select id="a-class">
        <option value="">— เลือก —</option>
      </select>
    </div>
    <div class="form-g">
      <label>ครูผู้สอน</label>
      <select id="a-teacher">
        <option value="">— เลือก —</option>
      </select>
    </div>
    <div class="form-g">
      <label>หมายเหตุ</label>
      <input id="a-note" placeholder="เช่น ห้องเรียน LAB, ห้องพละ..."/>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('add-modal')">ยกเลิก</button>
      <button class="btn btn-blue" onclick="addEntry()">+ เพิ่ม</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="auth-guard.js"></script>
<script>
AuthGuard.init('read-only');
const db=_db;

const DAYS=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์'];
const DAY_EN=['Mon','Tue','Wed','Thu','Fri'];
const PERIODS=['คาบ 1\n08:30','คาบ 2\n09:30','คาบ 3\n10:30','คาบ 4\n11:30','คาบ 5\n13:00','คาบ 6\n14:00','คาบ 7\n15:00'];
const SUBJ_NAMES={thai:'ภาษาไทย',math:'คณิตศาสตร์',sci:'วิทยาศาสตร์',social:'สังคมศึกษา',eng:'ภาษาอังกฤษ',pe:'สุขศึกษา/พลศึกษา',art:'ศิลปะ',tech:'เทคโนโลยี',home:'การงานอาชีพ',act:'กิจกรรม',other:'อื่นๆ'};
const LEGEND_COLORS={'ภาษาไทย':'#f59e0b','คณิตศาสตร์':'#14b8a6','วิทยาศาสตร์':'#8b5cf6','สังคมศึกษา':'#f97316','ภาษาอังกฤษ':'#ef4444','สุขศึกษา/พลศึกษา':'#3b82f6','ศิลปะ':'#ec4899','เทคโนโลยี':'#14b8a6','การงานอาชีพ':'#84cc16','กิจกรรม':'#6366f1','อื่นๆ':'#64748b'};

let STUDENTS=[],TEACHERS=[],SCHEDULE={};
let currentMode='class';

const CLASSES=['อนุบาล 1','อนุบาล 2','อนุบาล 3','ป.1','ป.2','ป.3','ป.4','ป.5','ป.6','ม.1','ม.2','ม.3'];

// LOAD
db.ref('students').on('value',snap=>{
  const cls=new Set();
  snap.forEach(c=>{const s=c.val();if(s.grade)cls.add(s.grade+(s.room?'/'+s.room:''));});
  STUDENTS=[...cls].sort();
  buildTargetSelect();
  buildClassSelect();
});
db.ref('teachers').on('value',snap=>{
  TEACHERS=[];
  snap.forEach(c=>TEACHERS.push({...c.val(),_id:c.key}));
  buildTargetSelect();
  buildTeacherSelect();
});
db.ref('schedule').on('value',snap=>{
  SCHEDULE=snap.val()||{};
  renderTable();
});

function getTerm(){return document.getElementById('sel-term').value;}
function getYear(){return document.getElementById('sel-year').value;}
function getTarget(){return document.getElementById('sel-target').value;}
function getKey(){return `${getTarget()}__${getTerm()}_${getYear()}`;}

function buildTargetSelect(){
  const sel=document.getElementById('sel-target');
  const cur=sel.value;
  if(currentMode==='class'){
    const classes=STUDENTS.length?STUDENTS:CLASSES;
    sel.innerHTML='<option value="">— เลือกห้องเรียน —</option>'+classes.map(c=>`<option value="cls_${c}">${c}</option>`).join('');
  } else {
    sel.innerHTML='<option value="">— เลือกครู —</option>'+TEACHERS.map(t=>`<option value="tch_${t._id}">${t.fname||''} ${t.lname||''}</option>`).join('');
  }
  if(cur)sel.value=cur;
}
function buildClassSelect(){
  const classes=STUDENTS.length?STUDENTS:CLASSES;
  document.getElementById('a-class').innerHTML='<option value="">— เลือก —</option>'+classes.map(c=>`<option value="${c}">${c}</option>`).join('');
}
function buildTeacherSelect(){
  document.getElementById('a-teacher').innerHTML='<option value="">— เลือก —</option>'+TEACHERS.map(t=>`<option value="${t._id}">${t.fname||''} ${t.lname||''}</option>`).join('');
}

// RENDER TABLE
function renderTable(){
  const target=getTarget();
  if(!target){document.getElementById('timetable-wrap').innerHTML='<div style="text-align:center;padding:48px;color:var(--hint)">เลือกห้องเรียนหรือครูด้านบนเพื่อดูตาราง</div>';buildLegend([]);return;}
  const key=getKey();
  const data=(SCHEDULE[key])||{};
  // data = {day_period: {subjectId, subjectName, cls, teacherName, teacherId, note, color}}
  
  let usedSubjects=new Set();
  let html=`<table class="timetable"><thead><tr>
    <th class="day-col">วัน/คาบ</th>
    ${PERIODS.map(p=>`<th>${p.replace('\n','<br/>')}</th>`).join('')}
  </tr></thead><tbody>`;

  DAYS.forEach((day,di)=>{
    html+=`<tr><td class="day-label">${day}<div class="day-th">${DAY_EN[di]}</div></td>`;
    PERIODS.forEach((_,pi)=>{
      const k=`${di}_${pi}`;
      const entry=data[k];
      if(entry){
        usedSubjects.add(entry.subjectName||'อื่นๆ');
        html+=`<td class="cell has-subject" onclick="openAddModal(${di},${pi})">
          <div class="subject-block ${entry.color||'sc-other'}">
            <button class="del-btn" onclick="event.stopPropagation();delEntry('${k}')">✕</button>
            <div class="sub-name">${entry.subjectName||'—'}</div>
            <div class="sub-teacher">${entry.teacherName||''}</div>
            ${entry.note?`<div class="sub-teacher">${entry.note}</div>`:''}
          </div>
        </td>`;
      } else {
        html+=`<td class="cell" onclick="openAddModal(${di},${pi})"><div class="cell-empty">+</div></td>`;
      }
    });
    html+=`</tr>`;
  });
  html+=`</tbody></table>`;
  document.getElementById('timetable-wrap').innerHTML=html;
  buildLegend([...usedSubjects]);
}

function buildLegend(subjects){
  document.getElementById('legend-wrap').innerHTML=subjects.map(s=>`
    <div class="legend-item">
      <div class="legend-dot" style="background:${LEGEND_COLORS[s]||'#64748b'}"></div>
      ${s}
    </div>`).join('');
}

// ADD ENTRY
let pendingDay=null,pendingPeriod=null;
function openAddModal(day,period){
  pendingDay=day??parseInt(document.getElementById('a-day').value);
  pendingPeriod=period??parseInt(document.getElementById('a-period').value);
  if(day!==undefined)document.getElementById('a-day').value=day;
  if(period!==undefined)document.getElementById('a-period').value=period;
  openModal('add-modal');
}

function addEntry(){
  if(!AuthGuard.requireLogin())return;
  const target=getTarget();
  if(!target){toast('❌ เลือกห้องเรียนหรือครูก่อน','err');closeModal('add-modal');return;}
  const day=parseInt(document.getElementById('a-day').value);
  const period=parseInt(document.getElementById('a-period').value);
  const subjVal=document.getElementById('a-subject').value;
  const cls=document.getElementById('a-class').value;
  const teacherId=document.getElementById('a-teacher').value;
  const note=document.getElementById('a-note').value.trim();
  if(!subjVal){toast('❌ เลือกวิชา','err');return;}

  const [subjId,color]=subjVal.split('|');
  const subjectName=SUBJ_NAMES[subjId]||'อื่นๆ';
  const teacher=TEACHERS.find(t=>t._id===teacherId);
  const teacherName=teacher?`${teacher.fname||''} ${teacher.lname||''}`:'';
  const key=getKey();
  const cellKey=`${day}_${period}`;
  const update={};
  update[`schedule/${key}/${cellKey}`]={subjectId:subjId,subjectName,color,cls:cls||'',teacherId:teacherId||'',teacherName,note};
  db.ref().update(update)
    .then(()=>{toast('✅ เพิ่มคาบเรียนแล้ว','ok');closeModal('add-modal');})
    .catch(e=>toast('❌ '+e.message,'err'));
}

function delEntry(cellKey){
  if(!AuthGuard.requireLogin())return;
  if(!confirm('ลบคาบเรียนนี้?'))return;
  db.ref(`schedule/${getKey()}/${cellKey}`).remove()
    .then(()=>toast('🗑 ลบแล้ว','ok'))
    .catch(e=>toast('❌ '+e.message,'err'));
}

function setMode(m){
  currentMode=m;
  document.getElementById('mt-class').classList.toggle('active',m==='class');
  document.getElementById('mt-teacher').classList.toggle('active',m==='teacher');
  document.getElementById('sel-target').value='';
  buildTargetSelect();
  renderTable();
}

function saveSchedule(){toast('✅ ตารางบันทึกอัตโนมัติใน Firebase','ok');}

function printSchedule(){
  const target=getTarget();
  if(!target){toast('⚠️ เลือกห้องก่อน','err');return;}
  window.print();
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function toast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(type?' '+type:'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
document.querySelectorAll('.modal-ov').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');}));
document.getElementById('sel-target').addEventListener('change',renderTable);
document.getElementById('sel-term').addEventListener('change',renderTable);
document.getElementById('sel-year').addEventListener('change',renderTable);
</script>
</body>
</html>
