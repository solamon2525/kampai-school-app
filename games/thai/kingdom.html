<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdom Duel: ศึกจอมปราชญ์กับบิ๊กกี้</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Mali', cursive; 
            background-color: #fdf4ff; 
            overflow-x: hidden; 
            user-select: none; 
        }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border: 4px solid #fff; }
        .btn-bounce { transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .btn-bounce:active { transform: scale(0.92); }
        .hp-bar-transition { transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .bg-royal-pattern {
            background-image: radial-gradient(#fbbf24 1px, transparent 1px);
            background-size: 25px 25px;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-floating { animation: floating 3s ease-in-out infinite; }
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
        }
        .timer-danger { animation: pulse-red 1s infinite; }
    </style>
</head>
<body class="bg-indigo-50 bg-royal-pattern min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Web Audio API SFX ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playSound = (type) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'item') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        };

        const vocabulary = {
            body: [
                { q: "หน้า", a: "พระพักตร์", hint: "นึกถึงคำว่า 'ใบหน้า' หรือ 'พักตร์' นะครับ" },
                { q: "ศีรษะ", a: "พระเศียร", hint: "อยู่สูงสุด คล้ายๆ 'เกษียร' ที่แปลว่าน้ำนมหรือยอดครับ" },
                { q: "ผม", a: "พระเกศา", hint: "สิ่งที่อยู่บนหัว นึกถึงคำว่า 'เกศ' นะครับ" },
                { q: "จมูก", a: "พระนาสิก", hint: "เอาไว้หายใจ นึกถึงช่อง 'นาสิก' สิครับ" },
                { q: "ปาก", a: "พระโอษฐ์", hint: "เอาไว้พูด นึกถึงคำที่ใช้กับปากบ่อยๆ นะ" },
                { q: "มือ", a: "พระหัตถ์", hint: "งานฝีมือเราเรียกว่า 'หัตถกรรม' ครับ!" },
                { q: "เท้า", a: "พระบาท", hint: "เวลาใส่รองเท้าเรียก 'ฉลองพระบาท' ครับ" },
                { q: "ตา", a: "พระเนตร", hint: "ดวงตาที่มองเห็น นึกถึง 'เนตรนารี' สิ!" }
            ],
            action: [
                { q: "ไป", a: "เสด็จ", hint: "คำสั้นๆ ที่แปลว่าเดินทางไปครับ" },
                { q: "นอน", a: "บรรทม", hint: "เวลาง่วงเราต้องไปทำสิ่งนี้ครับ" },
                { q: "กิน / ดื่ม", a: "เสวย", hint: "เวลาหิวเราต้อง 'เสวย' อาหารครับ" },
                { q: "หัวเราะ", a: "ทรงพระสรวล", hint: "เวลามีความสุขเราจะส่งเสียงแบบนี้!" },
                { q: "นั่ง", a: "ประทับ", hint: "นึกถึงการ 'ประทับ' ลงบนที่นั่งครับ" }
            ],
            item: [
                { q: "บ้าน", a: "พระราชวัง", hint: "ที่อยู่อันใหญ่โตของพระราชาครับ" },
                { q: "จดหมาย", a: "พระราชหัตถเลขา", hint: "จดหมายที่เขียนด้วย 'หัตถ์' (มือ) ไงครับ" },
                { q: "กระจก", a: "พระฉาย", hint: "สิ่งที่สะท้อนเงา 'ฉาย' ออกมาให้เห็นครับ" }
            ]
        };

        const App = () => {
            const [scene, setScene] = useState('menu'); // menu, battle, result
            const [mode, setMode] = useState('1p');
            const [p1, setP1] = useState({ hp: 100, inv: { magnifier: 1, shield: 1, power: 1 } });
            const [p2, setP2] = useState({ hp: 100, inv: { magnifier: 1, shield: 1, power: 1 } });
            const [turn, setTurn] = useState(1);
            const [timer, setTimer] = useState(30);
            const [question, setQuestion] = useState(null);
            const [options, setOptions] = useState([]);
            const [aiMsg, setAiMsg] = useState("สวัสดีครับ! ผมบิ๊กกี้ พร้อมช่วยน้องๆ ดวลความรู้แล้ว!");
            const [aiMood, setAiMood] = useState('happy'); // happy, thinking, sad, wow
            const [status, setStatus] = useState('waiting'); // waiting, processing
            const [activeBuffs, setActiveBuffs] = useState({ shield: false, double: false });

            // Timer logic
            useEffect(() => {
                let interval;
                if (scene === 'battle' && status === 'waiting' && timer > 0) {
                    interval = setInterval(() => setTimer(t => t - 1), 1000);
                } else if (timer === 0 && status === 'waiting') {
                    handleAnswer(null, true);
                }
                return () => clearInterval(interval);
            }, [scene, status, timer]);

            const generateQuestion = () => {
                const cats = Object.keys(vocabulary);
                const cat = cats[Math.floor(Math.random() * cats.length)];
                const pool = vocabulary[cat];
                const item = pool[Math.floor(Math.random() * pool.length)];
                
                let wrongs = [];
                const allWords = Object.values(vocabulary).flat().map(v => v.a);
                while (wrongs.length < 3) {
                    const w = allWords[Math.floor(Math.random() * allWords.length)];
                    if (w !== item.a && !wrongs.includes(w)) wrongs.push(w);
                }
                
                const opts = [{ text: item.a, correct: true, hidden: false }, ...wrongs.map(w => ({ text: w, correct: false, hidden: false }))];
                setQuestion(item);
                setOptions(opts.sort(() => Math.random() - 0.5));
                setTimer(30);
                setStatus('waiting');
                setActiveBuffs({ shield: false, double: false });
            };

            const startGame = (m) => {
                setMode(m);
                setP1({ hp: 100, inv: { magnifier: 1, shield: 1, power: 1 } });
                setP2({ hp: 100, inv: { magnifier: 1, shield: 1, power: 1 } });
                setTurn(1);
                setScene('battle');
                generateQuestion();
            };

            const usePowerUp = (type) => {
                if (status !== 'waiting') return;
                const cur = turn === 1 ? p1 : p2;
                if (cur.inv[type] <= 0) return;

                playSound('item');
                const updateInv = (p) => ({ ...p, inv: { ...p.inv, [type]: p.inv[type] - 1 } });
                if (turn === 1) setP1(updateInv); else setP2(updateInv);

                if (type === 'magnifier') {
                    let count = 0;
                    setOptions(prev => prev.map(o => {
                        if (!o.correct && count < 2) { count++; return { ...o, hidden: true }; }
                        return o;
                    }));
                    setAiMsg("บิ๊กกี้ใช้เนตรทิพย์! ตัดตัวเลือกที่ผิดออกไปให้ 2 ข้อแล้วครับ!");
                    setAiMood('wow');
                } else if (type === 'shield') {
                    setActiveBuffs(prev => ({ ...prev, shield: true }));
                    setAiMsg("กางโล่แก้ววชิระ! ข้อนี้ถ้าตอบผิด เลือดจะไม่ลดแน่นอนครับ!");
                    setAiMood('happy');
                } else if (type === 'power') {
                    setActiveBuffs(prev => ({ ...prev, double: true }));
                    setAiMsg("กินลูกกวาดพละกำลัง! ดาเมจในข้อนี้จะแรงเป็น 2 เท่าเลยนะ ลุย!!");
                    setAiMood('wow');
                }
            };

            const handleAnswer = (opt, isTimeout = false) => {
                if (status !== 'waiting') return;
                setStatus('processing');
                const isCorrect = opt?.correct;

                if (isCorrect) {
                    playSound('correct');
                    const dmg = activeBuffs.double ? 40 : 20;
                    if (turn === 1) setP2(p => ({ ...p, hp: Math.max(0, p.hp - dmg) }));
                    else setP1(p => ({ ...p, hp: Math.max(0, p.hp - dmg) }));
                    
                    setAiMsg(`ยอดเยี่ยม! "${question.a}" คือคำตอบที่ถูกต้อง!\n${activeBuffs.double ? "ดาเมจคูณสองสะใจไปเลย!" : "เก่งมากครับปราชญ์น้อย"}`);
                    setAiMood('wow');
                } else {
                    playSound('wrong');
                    if (activeBuffs.shield && !isTimeout) {
                        setAiMsg(`โอ๊ะ! เกือบถูกแล้วเชียว... แต่ดีนะที่มีโล่ป้องกันไว้!\nเฉลยคือ "${question.a}" ครับ`);
                        setAiMood('happy');
                    } else {
                        const dmg = 20;
                        if (turn === 1) setP1(p => ({ ...p, hp: Math.max(0, p.hp - dmg) }));
                        else setP2(p => ({ ...p, hp: Math.max(0, p.hp - dmg) }));
                        
                        setAiMsg(isTimeout ? "หมดเวลาซะแล้ว! ไม่เป็นไรนะ" : `ไม่เป็นไรนะ! คำนี้ยากไปนิด\nจำไว้นะ "${question.a}" คือ ${question.q}\n💡 ${question.hint}`);
                        setAiMood('sad');
                    }
                }

                setTimeout(() => {
                    const nextP1 = turn === 1 ? (activeBuffs.shield || isCorrect ? p1.hp : p1.hp - 20) : (isCorrect ? p1.hp - (activeBuffs.double ? 40 : 20) : p1.hp);
                    const nextP2 = turn === 1 ? (isCorrect ? p2.hp - (activeBuffs.double ? 40 : 20) : p2.hp) : (activeBuffs.shield || isCorrect ? p2.hp : p2.hp - 20);

                    if (nextP1 <= 0 || nextP2 <= 0) {
                        setScene('result');
                    } else {
                        setTurn(turn === 1 ? 2 : 1);
                        generateQuestion();
                        setAiMood('happy');
                    }
                }, 4000);
            };

            const renderBackpack = (player, pNum) => (
                <div className={`p-4 rounded-3xl border-4 transition-all duration-500 ${turn === pNum ? 'bg-white shadow-xl scale-105 border-yellow-400' : 'bg-gray-100 opacity-60 border-transparent'}`}>
                    <div className="text-center font-bold text-gray-700 text-sm mb-3">🎒 กระเป๋าผู้เล่นที่ {pNum}</div>
                    <div className="flex justify-center gap-3">
                        <button onClick={() => usePowerUp('magnifier')} disabled={player.inv.magnifier <= 0 || turn !== pNum} className={`w-14 h-14 rounded-2xl text-2xl shadow-md border-b-4 flex items-center justify-center btn-bounce ${player.inv.magnifier > 0 ? 'bg-blue-50 border-blue-300' : 'bg-gray-200 grayscale opacity-40'}`}>
                            👓 {player.inv.magnifier > 0 && <span className="absolute -top-1 -right-1 bg-blue-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">{player.inv.magnifier}</span>}
                        </button>
                        <button onClick={() => usePowerUp('shield')} disabled={player.inv.shield <= 0 || turn !== pNum} className={`w-14 h-14 rounded-2xl text-2xl shadow-md border-b-4 flex items-center justify-center btn-bounce ${player.inv.shield > 0 ? 'bg-green-50 border-green-300' : 'bg-gray-200 grayscale opacity-40'}`}>
                            🛡️ {player.inv.shield > 0 && <span className="absolute -top-1 -right-1 bg-green-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">{player.inv.shield}</span>}
                        </button>
                        <button onClick={() => usePowerUp('power')} disabled={player.inv.power <= 0 || turn !== pNum} className={`w-14 h-14 rounded-2xl text-2xl shadow-md border-b-4 flex items-center justify-center btn-bounce ${player.inv.power > 0 ? 'bg-pink-50 border-pink-300' : 'bg-gray-200 grayscale opacity-40'}`}>
                            🍭 {player.inv.power > 0 && <span className="absolute -top-1 -right-1 bg-pink-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">{player.inv.power}</span>}
                        </button>
                    </div>
                </div>
            );

            if (scene === 'menu') return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6">
                    <div className="glass-panel p-10 rounded-[3rem] shadow-2xl text-center max-w-lg w-full">
                        <div className="text-8xl mb-6 animate-floating">👑</div>
                        <h1 className="text-5xl font-black text-indigo-900 mb-2 drop-shadow-sm">Kingdom Duel</h1>
                        <p className="text-orange-500 font-bold text-xl mb-10">ศึกคำราชาศัพท์ฉบับบิ๊กกี้</p>
                        <div className="space-y-4">
                            <button onClick={() => startGame('1p')} className="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold py-5 rounded-2xl text-2xl shadow-lg hover:shadow-xl transition-all btn-bounce border-b-8 border-blue-800">👤 เล่นกับบิ๊กกี้</button>
                            <button onClick={() => startGame('2p')} className="w-full bg-gradient-to-r from-orange-500 to-orange-600 text-white font-bold py-5 rounded-2xl text-2xl shadow-lg hover:shadow-xl transition-all btn-bounce border-b-8 border-orange-800">👥 ดวลกับเพื่อน</button>
                        </div>
                    </div>
                </div>
            );

            if (scene === 'result') return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6">
                    <div className="glass-panel p-10 rounded-[3rem] shadow-2xl text-center max-w-lg w-full">
                        <div className="text-9xl mb-6">{p1.hp > p2.hp ? '🏆' : '💀'}</div>
                        <h2 className="text-4xl font-bold text-indigo-900 mb-6">{p1.hp > p2.hp ? 'ผู้เล่นที่ 1 ชนะ!' : (mode === '1p' ? 'บิ๊กกี้ชนะแล้ว!' : 'ผู้เล่นที่ 2 ชนะ!')}</h2>
                        <div className="bg-indigo-50 p-6 rounded-3xl border-2 border-indigo-200 mb-8">
                            <p className="text-indigo-800 text-lg">"{aiMsg}"</p>
                        </div>
                        <button onClick={() => setScene('menu')} className="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl text-xl shadow-md btn-bounce">กลับหน้าหลัก</button>
                    </div>
                </div>
            );

            return (
                <div className="max-w-4xl mx-auto p-4 flex flex-col min-h-screen">
                    {/* Status Bars */}
                    <div className="flex justify-between items-center bg-white p-4 rounded-3xl shadow-md mb-6 border-4 border-indigo-100">
                        <div className="w-1/3">
                            <div className="text-xs font-bold text-blue-800 mb-1">P1 HP {activeBuffs.shield && turn === 1 && '🛡️'}</div>
                            <div className="h-6 bg-gray-200 rounded-full overflow-hidden border-2 border-white shadow-inner">
                                <div className={`h-full hp-bar-transition ${p1.hp > 30 ? 'bg-green-500' : 'bg-red-500'}`} style={{ width: `${p1.hp}%` }}></div>
                            </div>
                        </div>
                        <div className={`w-16 h-16 flex items-center justify-center rounded-full border-4 text-3xl font-black ${timer <= 5 ? 'bg-red-50 border-red-500 text-red-500 timer-danger' : 'bg-white border-indigo-200 text-indigo-900 shadow-sm'}`}>
                            {timer}
                        </div>
                        <div className="w-1/3">
                            <div className="text-xs font-bold text-red-800 mb-1 text-right">{mode === '2p' ? 'P2' : 'BIGGIE'} HP {activeBuffs.shield && turn === 2 && '🛡️'}</div>
                            <div className="h-6 bg-gray-200 rounded-full overflow-hidden border-2 border-white shadow-inner">
                                <div className={`h-full bg-purple-500 hp-bar-transition`} style={{ width: `${p2.hp}%` }}></div>
                            </div>
                        </div>
                    </div>

                    {/* AI Coach Bubble */}
                    <div className="flex items-start gap-4 mb-8">
                        <div className="text-7xl bg-white p-2 rounded-full border-4 border-yellow-300 shadow-lg animate-floating">
                            {{ happy: '🤓', thinking: '🤔', sad: '🥹', wow: '🤩' }[aiMood]}
                        </div>
                        <div className="flex-1 bg-white p-6 rounded-3xl rounded-tl-none border-4 border-white shadow-lg relative">
                            <div className="absolute top-0 left-[-16px] border-[12px] border-transparent border-r-white border-t-white"></div>
                            <p className="text-indigo-900 font-bold text-lg leading-relaxed whitespace-pre-line">{aiMsg}</p>
                        </div>
                    </div>

                    {/* Question Card */}
                    <div className="bg-gradient-to-br from-yellow-300 to-orange-400 p-8 rounded-[3rem] shadow-xl border-8 border-white mb-8 text-center">
                        <p className="text-orange-900 font-bold text-xl mb-2">คำราชาศัพท์ของคำว่า</p>
                        <h2 className="text-6xl font-black text-white drop-shadow-md">"{question?.q}"</h2>
                        <p className="text-orange-100 font-bold mt-4">คือข้อไหนนะ?</p>
                    </div>

                    {/* Options Grid */}
                    <div className="grid grid-cols-2 gap-4 mb-10">
                        {options.map((opt, i) => (
                            opt.hidden ? <div key={i} className="bg-gray-200 rounded-2xl opacity-20 border-2 border-dashed border-gray-400"></div> :
                            <button key={i} disabled={status !== 'waiting'} onClick={() => handleAnswer(opt)} className={`p-6 rounded-3xl text-2xl font-bold shadow-md btn-bounce border-b-8 transition-all duration-300 
                                ${status === 'waiting' ? 'bg-white text-indigo-900 border-indigo-200 hover:border-indigo-400' : 
                                (opt.correct ? 'bg-green-500 text-white border-green-700 scale-105' : 'bg-red-400 text-white border-red-600 opacity-50')}`}>
                                {opt.text}
                            </button>
                        ))}
                    </div>

                    {/* Inventory/Backpacks */}
                    <div className="grid grid-cols-2 gap-6 mt-auto">
                        {renderBackpack(p1, 1)}
                        {renderBackpack(p2, 2)}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
